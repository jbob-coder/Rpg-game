<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#101218" />
<title>RPG · Malla de interfaz v0.2</title>
<style>
:root{color-scheme:dark;--canvas:#101218;--surface:#191c22;--surface-2:#22262e;--line:#544632;--gold:#d9b36c;--text:#f2eee6;--muted:#b9b4aa;--inactive:#858994;--danger:#df9087;--pad:16px;--space:12px;--type:16px;--radius:12px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0c10;color:var(--text)}button{font:inherit}button:focus-visible{outline:3px solid #ffdc8f;outline-offset:2px}#app{min-height:100dvh;max-width:720px;margin:0 auto}.shell{height:100dvh;min-height:0;background:var(--canvas);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overflow:hidden}.header{height:56px;min-height:56px;border-bottom:1px solid #35343b;display:flex;gap:12px;align-items:center;padding:0 var(--pad)}.app-symbol{width:30px;height:30px;display:grid;place-items:center;color:var(--gold);border:1px solid var(--line);border-radius:9px;font-weight:750}.header-title{flex:1;min-width:0}.eyebrow{display:block;color:var(--gold);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.header h1{font-size:18px;line-height:1.2;margin:0;font-weight:670;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tool{border:1px solid #58515a;background:#22242b;color:#eee7dc;border-radius:9px;min-width:45px;min-height:45px;padding:9px 11px;cursor:pointer}.tool.active{border-color:var(--gold);color:var(--gold)}.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex-shrink:0;border-bottom:1px solid #35343b;padding:6px 12px;min-height:54px}.subtabs button{flex:0 0 auto;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:8px;padding:10px 12px;min-height:42px;cursor:pointer;font-size:14px}.subtabs button.active{border-color:#745e38;background:#2d291f;color:#ffda90}.body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-color:#65553d transparent;padding:18px var(--pad) 28px}.stack{display:flex;flex-direction:column;gap:var(--space)}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}.section-head h2{font-size:22px;line-height:1.22;margin:0;font-weight:700}.overline{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}.hint,.meta{font-size:13px;color:var(--muted);line-height:1.45}.caption{font-size:12px;color:#c0b59d}.card{background:var(--surface);border:1px solid #474039;border-radius:var(--radius);padding:14px;min-width:0;overflow-wrap:anywhere}.card h3{margin:0 0 9px;font-size:16px;font-weight:650}.card p{margin:0 0 10px;line-height:1.6;font-size:var(--type)}.card p:last-child{margin-bottom:0}.card.slim{padding:11px 13px}.gold{color:var(--gold)}.muted{color:var(--muted)}.badge{border:1px solid #6f5c3e;color:#edd19c;border-radius:999px;padding:4px 8px;font-size:12px;white-space:nowrap;display:inline-block}.badge.locked{color:#c8c4c0;border-color:#686363}.grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--surface-2);border:1px solid #3c3f44;border-radius:10px;padding:11px;min-width:0}.metric b{display:block;font-size:19px;font-variant-numeric:tabular-nums}.metric span{font-size:12px;color:var(--muted)}.pair{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0;padding:9px 0;border-bottom:1px solid #35353a;font-size:14px}.pair:last-child{border-bottom:0}.pair strong{font-weight:650;font-variant-numeric:tabular-nums;text-align:right}.bar{height:7px;border-radius:99px;background:#434349;overflow:hidden;margin:7px 0 0}.bar>span{display:block;height:100%;background:#c7a15c;border-radius:inherit}.list{display:flex;flex-direction:column;gap:8px}.action{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid #605541;background:var(--surface-2);color:var(--text);border-radius:10px;padding:12px 14px;min-height:50px;cursor:pointer;font-size:14px;line-height:1.35}.action.primary{border-color:#b28d4a;background:#3d301d;color:#ffe1a1}.action:disabled{opacity:.65;cursor:not-allowed}.action .detail{font-size:12px;color:var(--muted);font-weight:400}.actions{border-top:1px solid #37383d;background:#17191e;padding:10px var(--pad);max-height:min(43dvh,340px);overflow:auto;flex-shrink:0}.actions h3{font-size:14px;margin:0 0 9px;color:#e5d1a7}.actions .list{gap:7px}.nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid #484034;flex-shrink:0;height:64px;min-height:64px;background:#121419}.nav button{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:2px;background:none;border:none;color:#b4b0aa;min-width:0;min-height:56px;cursor:pointer;font-size:12px}.nav button strong{font-size:18px;font-weight:550}.nav button.active{color:var(--gold);background:#27221b;border-top:2px solid #d8b067}.help{font-size:13px;line-height:1.5;background:#272624;border-left:3px solid var(--gold);padding:10px 12px;color:#dfd5c6;border-radius:0 9px 9px 0}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:3px}.chip{border:1px solid #63523a;color:#e4d3b6;background:#29261f;border-radius:30px;padding:9px 13px;white-space:nowrap;min-height:45px;cursor:pointer}.chip.active{background:#4a3620;border-color:#cfaa69;color:#ffe6b2}.tree{display:flex;flex-direction:column;gap:13px}.branch{border-left:2px solid #8c7041;padding:2px 0 0 13px}.branch h4{color:#e6c98f;margin:3px 0 12px;font-size:15px}.node{position:relative;background:var(--surface-2);border:1px solid #6e614b;border-radius:10px;margin:0 0 10px;padding:11px;min-height:53px}.node:before{content:"";position:absolute;left:-19px;top:18px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--canvas)}.node.locked{border-color:#4d4d55;color:#aaa9ab}.node.locked:before{background:#77757d}.node small{display:block;font-size:12px;line-height:1.45;color:var(--muted);margin-top:5px}.inline-label{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.selector{display:flex;gap:9px;align-items:center;justify-content:space-between}.selector>span{flex:1;min-width:0}.selector button{background:#41311f;color:#f2d79e;border:1px solid #a48852;border-radius:8px;min-height:45px;padding:8px 12px;cursor:pointer}.selector button[aria-pressed="true"]{background:#7a592a;color:#fff1d3}.timeline{border-left:2px solid #80663c;padding:0 0 0 15px;display:grid;gap:15px}.event{position:relative;line-height:1.45}.event:before{content:"";position:absolute;left:-21px;top:4px;background:#d6b16a;width:10px;height:10px;border-radius:50%}.event small{color:var(--gold);display:block}.footer-note{color:#aca6a2;font-size:12px;margin-top:4px}.debug .card,.debug .header,.debug .nav,.debug .subtabs,.debug .actions,.debug .metric{outline:1px dashed #6f8da1;outline-offset:-3px}.debug .body{background-image:repeating-linear-gradient(to right,transparent,transparent calc(25% - 1px),#49607336 calc(25% - 1px),#49607336 25%)}.debug .card::after{content:attr(data-box);display:block;margin-top:7px;color:#86b7cb;font-size:10px;letter-spacing:.03em}.zoom{--type:20px}.zoom .action{font-size:17px}.zoom .pair{font-size:17px}.zoom .subtabs button{font-size:16px}.zoom .card h3{font-size:18px}
@media(min-width:600px){:root{--pad:24px}.shell{border-left:1px solid #302d2b;border-right:1px solid #302d2b}.body{padding-top:24px}.grid-two{gap:14px}}
@media(max-width:359px){:root{--pad:12px;--space:10px}.header{height:52px;min-height:52px}.header h1{font-size:16px}.card{padding:11px}.grid-two{grid-template-columns:1fr}.metric b{font-size:17px}.nav{height:59px;min-height:59px}.nav button{font-size:11px}}
@media(max-height:650px){.body{padding-top:12px}.header{height:50px;min-height:50px}.actions{max-height:35dvh}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}

/* Responsive decisions dock: player can reclaim reading height. */
.actions.collapsed{max-height:none;overflow:visible}
.actions.collapsed .list{display:none}
.action-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.action-head h3{margin:0}
.action-toggle{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:8px;min-height:48px;padding:8px 12px;cursor:pointer}
/* Accessible large-text mode: scale typography without hard truncation. */
.zoom{--type:32px}
.zoom .card h3,.zoom .section-head h2{font-size:30px}
.zoom .action,.zoom .pair{font-size:27px}
.zoom .pair{align-items:flex-start;flex-wrap:wrap}
.zoom .pair strong{max-width:100%;overflow-wrap:anywhere}
.zoom .subtabs button{font-size:22px;min-height:48px}
.zoom .hint,.zoom .meta,.zoom .footer-note,.zoom .caption,.zoom .node small{font-size:23px}
.zoom .badge,.zoom .metric span{font-size:21px;white-space:normal}
.zoom .metric b{font-size:28px}
.zoom .nav{height:84px;min-height:84px}
.zoom .nav button{font-size:17px}
.zoom .header{height:auto;min-height:56px;padding-top:7px;padding-bottom:7px}
.zoom .header h1{font-size:27px;white-space:normal}
.zoom .eyebrow,.zoom .overline{font-size:16px}
.zoom .actions h3,.zoom .action-toggle{font-size:20px}
.zoom .action .detail{font-size:22px}
@media(max-height:420px){.shell{min-height:0}.nav{height:56px;min-height:56px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Pure fixture content; no game logic or persistence. Change the adapter for a future engine. */
const FIXTURE=Object.freeze({hero:'Adventurer',className:'Swordsman',background:'Noble Heir',rarity:'Epic',scene:'The Market Square',location:'Rivencross',hp:[48,48],mp:[16,16],stamina:[24,24],xp:[240,500],stats:[['Strength','12'],['Dexterity','14'],['Endurance','13'],['Intelligence','10'],['Wisdom','11'],['Charisma','10']]});
const SECTIONS=['Overview','Stats','Skills','Abilities','Class','Background'];
const app=document.querySelector('#app');
const state={screen:'story',tab:'Overview',showGrid:false,largeText:false,choicesCollapsed:false,scrollPositions:{},selectedSkill:'Sword Mastery',skillCategory:'Combat',origin:'Noble Heir',initialClass:'Swordsman',feedback:''};
function text(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function card(title,content,box='Componente adaptable'){return `<section class="card stack" data-box="${text(box)}"><h3>${title}</h3>${content}</section>`;}
function pair(a,b){return `<div class="pair"><span>${text(a)}</span><strong>${text(b)}</strong></div>`;}
function metric(label,value){return `<div class="metric"><b>${text(value)}</b><span>${text(label)}</span></div>`;}
function pill(s){return `<span class="badge">${text(s)}</span>`;}
function action(label,act,primary=false,desc=''){return `<button class="action ${primary?'primary':''}" data-action="${text(act)}"><span>${text(label)}${desc?`<br><span class="detail">${text(desc)}</span>`:''}</span><span aria-hidden="true">›</span></button>`;}
function notice(){return state.feedback?`<div class="help" role="status">${text(state.feedback)}</div>`:'';}
function story(){return `<div class="stack"><div class="section-head"><div><div class="overline">Día 3 · Primavera · Mañana</div><h2>${text(FIXTURE.scene)}</h2></div>${pill(FIXTURE.location)}</div><p class="hint">Ubicación narrativa, sin mapa. El mundo puede cambiar por eventos independientes de la pantalla.</p>${card('Escena',`<p>Entras en la plaza del mercado. El olor del pan recién horneado se mezcla con el ruido de vendedores y viajeros.</p><p>Un herrero trabaja frente a su taller mientras dos mercaderes discuten cerca de la fuente.</p><p>La gente continúa con sus asuntos, independientemente de tu decisión.</p>`,'Texto principal · ocupa alto disponible')}${notice()}<p class="footer-note">Texto y cifras ilustrativos; esta maqueta no ejecuta la historia.</p></div>`;}
function storyActions(){return `<div class="action-head"><h3>¿Qué quieres hacer?</h3><button class="action-toggle" data-action="toggle-choices" aria-expanded="${!state.choicesCollapsed}">${state.choicesCollapsed?'Mostrar opciones':'Ocultar opciones'}</button></div><div class="list">${action('Hablar con el herrero','choice-smith',true)}${action('Observar los puestos','choice-stalls')}${action('Más acciones','more-actions')}</div>`;}
function overview(){return `<div class="stack"><div class="section-head"><h2>Resumen del personaje</h2>${pill('Nivel 3')}</div>${card(text(FIXTURE.hero),`<div class="inline-label"><span class="muted">Clase: ${text(FIXTURE.className)}</span>${pill('Origen: Epic')}</div><div class="grid-two">${metric('HP','48 / 48')}${metric('MP','16 / 16')}${metric('Resistencia','24 / 24')}${metric('XP','240 / 500')}</div>`,'Identidad / condición')}${card('Resumen',`${pair('Clase activa',FIXTURE.className)}${pair('Trasfondo',FIXTURE.background)}${pair('Estado','Sin efectos')}`,'Datos abreviados, no Stats completo')}${card('Accesos relacionados',`<div class="list">${action('Ver estadísticas','tab-Stats')}${action('Ver habilidades','tab-Abilities')}${action('Ver Background','tab-Background')}</div>`,'Navegación, no lógica de juego')}</div>`;}
function stats(){return `<div class="stack"><div class="section-head"><h2>Estadísticas</h2>${pill('Solo lectura')}</div><div class="grid-two">${metric('HP',FIXTURE.hp.join(' / '))}${metric('MP',FIXTURE.mp.join(' / '))}${metric('STA',FIXTURE.stamina.join(' / '))}${metric('XP',FIXTURE.xp.join(' / '))}</div>${card('Atributos principales',FIXTURE.stats.map(x=>pair(...x)).join(''),'Lista adaptable · atributos base')}${card('Derivados y resistencias',`<details><summary class="gold" style="min-height:40px;cursor:pointer">Mostrar valores derivados</summary>${pair('Ataque','18')}${pair('Defensa','16')}${pair('Resistencias','Consultar ficha')}</details>`,'Datos secundarios plegables')}<p class="hint">No hay botones para modificar puntos: el motor todavía no define esa regla.</p></div>`;}
function skills(){let types=['Combat','Magic','Survival','Crafting','Social'];let levels=state.skillCategory==='Combat'?[['Sword Mastery','2 / 10'],['Axe Mastery','1 / 10'],['Defense','1 / 10']]:[['Competencia de ejemplo','Bloqueada']];return `<div class="stack"><div class="section-head"><h2>Skills</h2>${pill('Progresión de destrezas')}</div><div class="chips" aria-label="Categorías">${types.map(t=>`<button class="chip ${state.skillCategory===t?'active':''}" data-action="cat-${t}" aria-pressed="${state.skillCategory===t}">${t}</button>`).join('')}</div>${card('Competencias',`<div class="list">${levels.map(([n,l])=>action(n,'skill-'+n,n===state.selectedSkill,l)).join('')}</div>`,'Lista apilada; sin doble columna')}${card('Detalle seleccionado',`<div class="inline-label"><b>${text(state.selectedSkill)}</b>${pill('Ejemplo')}</div><p class="hint">Las reglas de entrenamiento, costes y desbloqueos siguen pendientes de definición.</p><div class="bar"><span style="width:35%"></span></div>`,'Detalle progresivo')}</div>`;}
function abilities(){return `<div class="stack"><div class="section-head"><h2>Ability Tree</h2>${pill('Clase: '+FIXTURE.className)}</div><p class="hint">Ability Proficiency y árbol comparten este panel. Las ramas dependen de requisitos; no existen cooldowns.</p>${card('Ability Proficiency',`${pair('Combate','Rango 1')}${pair('Defensa','Bloqueado')}${pair('Especialización','Bloqueado')}`,'Resumen de dominio')}${card('Árbol de habilidades',`<div class="tree"><div class="branch"><h4>Fundamentos</h4><div class="node"><strong>Sword Strike</strong><small>Disponible · Nodo base</small></div><div class="node locked"><strong>Guard Break <span aria-label="Bloqueado">🔒</span></strong><small>Requiere progreso en Sword Strike</small></div></div><div class="branch"><h4>Rama defensiva</h4><div class="node locked"><strong>Iron Guard <span aria-label="Bloqueado">🔒</span></strong><small>Requiere clase y prerrequisitos</small></div><div class="node locked"><strong>Counterstance <span aria-label="Bloqueado">🔒</span></strong><small>Requiere desbloquear Iron Guard</small></div></div><div class="branch"><h4>Especialización</h4><div class="node locked"><strong>Blade Mastery <span aria-label="Bloqueado">🔒</span></strong><small>Rama avanzada aún inaccesible</small></div></div></div>`,'Conexiones verticales + requisitos; alternativa legible')}<p class="hint">Los nodos son demostrativos. En el juego real el dominio valida cada desbloqueo.</p></div>`;}
function classes(){return `<div class="stack"><div class="section-head"><h2>Clase</h2>${pill('Actual')}</div>${card(FIXTURE.className,`<p class="muted">Clase elegida al iniciar la partida. La progresión y las clases avanzadas dependerán de reglas del juego.</p>${pair('Progreso de ejemplo','Nivel 3')}${pair('Árbol asociado','Ability Tree')}`,'Resumen de clase')}${card('Opciones y requisitos',`${pair('Mage','No elegida')}${pair('Archer','No elegida')}${pair('Clase avanzada','Bloqueada')}`,'Sin cambio de clase inventado')}${action('Ir al Ability Tree','tab-Abilities')}</div>`;}
function background(){return `<div class="stack"><div class="section-head"><h2>Background</h2>${pill(FIXTURE.rarity)}</div>${card(FIXTURE.background,`<p>Origen elegido antes de comenzar. El trasfondo es información histórica, no una elección que se puede reiniciar desde Character.</p>${pair('Categoría','Origen')}${pair('Rareza','Epic')}`,'Resumen inmutable')}${card('Background History Log',`<div class="timeline"><div class="event"><small>Antes de la partida</small>Origen establecido</div><div class="event"><small>Día 1</small>Comienza la aventura</div><div class="event"><small>Día 3</small>Una noticia puede descubrirse más tarde</div></div>`,'Eventos anexados, no reescritos')}<p class="hint">Los registros son ejemplos; el juego deberá distinguir acontecimientos reales de información conocida.</p></div>`;}
function inventory(){return `<div class="stack"><h2>Inventario</h2>${card('Objetos de ejemplo',`${pair('Espada de entrenamiento','1')}${pair('Poción','2')}${pair('Monedas','150')}`,'Lista y detalle futuro')}<p class="hint">Maqueta de ubicación de elementos; sin gestión de objetos implementada.</p></div>`;}
function journal(){return `<div class="stack"><h2>Journal</h2>${card('Acontecimientos conocidos',`<div class="timeline"><div class="event"><small>Día 1</small>Comienzo de la historia</div><div class="event"><small>Día 3</small>Rumor en el mercado</div></div>`,'Solo hechos conocidos')}<p class="hint">El motor mundial podrá generar eventos antes de que lleguen a este registro.</p></div>`;}
function newGame(){return `<div class="stack"><div class="section-head"><h2>Nueva partida</h2>${pill('Vista previa')}</div><p class="hint">El flujo real confirmará clase y background antes de crear el escenario. Aquí solo se prueban las cajas del layout.</p>${card('1 · Clase inicial',`<div class="list">${['Swordsman','Mage','Archer'].map(s=>`<div class="selector"><span>${s}</span><button data-action="class-${s}" aria-pressed="${state.initialClass===s}">${state.initialClass===s?'Elegida':'Elegir'}</button></div>`).join('')}</div>`,'Selector compartido')}${card('2 · Background',`<div class="list">${['Noble Heir','Scholar','Orphan'].map(s=>`<div class="selector"><span>${s}${s==='Noble Heir'?' · Epic':''}</span><button data-action="origin-${s}" aria-pressed="${state.origin===s}">${state.origin===s?'Elegido':'Elegir'}</button></div>`).join('')}</div>`,'Cajas independientes, una columna')}${card('3 · Resumen',`${pair('Clase',state.initialClass)}${pair('Background',state.origin)}<p class="hint">La combinación influirá en el escenario inicial mediante reglas que aún no se han implementado.</p>`,'Revisión previa a confirmar')}${action('Confirmar (demo, no crea partida)','confirm',true)}${notice()}</div>`;}
function more(){return `<div class="stack"><h2>Más opciones</h2>${card('Navegación de prueba',`<div class="list">${action('Nueva partida · blueprint','open-creation')}${action('Journal · blueprint','open-journal')}</div>`,'Pantallas de ejemplo')}${card('Herramientas de diseño',`<div class="list">${action(state.showGrid?'Ocultar malla y guías':'Mostrar malla y guías','toggle-grid')}${action(state.largeText?'Tamaño de texto normal':'Aumentar tamaño del texto','toggle-font')}</div>`,'Control de inspección visual')}<p class="hint">No hay conexión al motor del RPG ni persistencia. Las referencias originales no son sprites ni texturas de producción.</p></div>`;}
function content(){switch(state.screen){case 'story':return story();case 'character':return ({Overview:overview,Stats:stats,Skills:skills,Abilities:abilities,Class:classes,Background:background}[state.tab])();case 'inventory':return inventory();case 'journal':return journal();case 'new-game':return newGame();default:return more();}}
function viewKey(){return state.screen==='character'?'character:'+state.tab:state.screen;}
function render(){const isChar=state.screen==='character';app.className=(state.showGrid?'debug ':'')+(state.largeText?'zoom':'');const title=state.screen==='character'?'Character':({'story':'Story','inventory':'Inventory','more':'More','journal':'Journal','new-game':'New Game'})[state.screen];app.innerHTML=`<div class="shell"><header class="header"><div class="app-symbol" aria-hidden="true">R</div><div class="header-title"><span class="eyebrow">RPG · UI Blueprint v0.2</span><h1>${text(title)}</h1></div><button class="tool ${state.showGrid?'active':''}" data-action="toggle-grid" aria-label="Alternar guías de malla" title="Ver malla">▦</button><button class="tool ${state.largeText?'active':''}" data-action="toggle-font" aria-label="Alternar texto grande" title="Texto grande">A+</button></header>${isChar?`<nav class="subtabs" aria-label="Secciones de Character">${SECTIONS.map(s=>`<button data-action="tab-${s}" class="${state.tab===s?'active':''}" aria-current="${state.tab===s?'page':'false'}">${s}</button>`).join('')}</nav>`:''}<main class="body" id="main">${content()}</main>${state.screen==='story'?`<aside class="actions ${state.choicesCollapsed?'collapsed':''}" aria-label="Decisiones de escena">${storyActions()}</aside>`:''}<nav class="nav" aria-label="Navegación principal">${[['story','Story','▤'],['character','Character','♙'],['inventory','Inventory','▣'],['more','More','☷']].map(([s,t,i])=>`<button data-action="nav-${s}" class="${state.screen===s?'active':''}" aria-current="${state.screen===s?'page':'false'}"><strong aria-hidden="true">${i}</strong>${t}</button>`).join('')}</nav></div>`;}
app.addEventListener('click',event=>{const b=event.target.closest('button[data-action]');if(!b)return;const main=app.querySelector('.body');if(main)state.scrollPositions[viewKey()]=main.scrollTop;const a=b.dataset.action;state.feedback='';if(a.startsWith('nav-'))state.screen=a.slice(4);else if(a.startsWith('tab-')){state.screen='character';state.tab=a.slice(4);}else if(a.startsWith('cat-')){state.skillCategory=a.slice(4);state.selectedSkill=state.skillCategory==='Combat'?'Sword Mastery':'Competencia de ejemplo';}else if(a.startsWith('skill-'))state.selectedSkill=a.slice(6);else if(a.startsWith('class-'))state.initialClass=a.slice(6);else if(a.startsWith('origin-'))state.origin=a.slice(7);else if(a==='open-creation')state.screen='new-game';else if(a==='open-journal')state.screen='journal';else if(a==='toggle-choices')state.choicesCollapsed=!state.choicesCollapsed;else if(a==='toggle-grid')state.showGrid=!state.showGrid;else if(a==='toggle-font')state.largeText=!state.largeText;else if(a==='confirm')state.feedback='Vista previa: la creación y el guardado de personajes aún no están implementados.';else if(a==='more-actions')state.feedback='Las acciones adicionales serán definidas por el motor narrativo.';else if(a.startsWith('choice-'))state.feedback='Decisión de ejemplo seleccionada; no se ha modificado el mundo del juego.';render();const newMain=app.querySelector('.body');if(newMain)newMain.scrollTop=state.scrollPositions[viewKey()]||0;});
render();
</script>
</body>
</html>
